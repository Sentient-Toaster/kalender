<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalender">
<title>Unterrichtskalender</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='48' rx='8' fill='%232f5bd3'/%3E%3Crect x='6' y='10' width='52' height='14' rx='6' fill='%231f3f99'/%3E%3Cg fill='%23fff'%3E%3Crect x='14' y='30' width='10' height='8' rx='2'/%3E%3Crect x='27' y='30' width='10' height='8' rx='2'/%3E%3Crect x='40' y='30' width='10' height='8' rx='2'/%3E%3Crect x='14' y='42' width='10' height='8' rx='2'/%3E%3Crect x='27' y='42' width='10' height='8' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f4f1; --fl: #ffffff; --fl2: #fafaf8; --tx: #1c1c1f; --mu: #6a6a72; --li: #e3e3df;
  --ak: #2f5bd3; --ak-text: #ffffff; --warn: #c62828; --heute: rgba(47, 91, 211, .07);
  --gelb: #b58a00; --gruen: #23914a; --orange: #e07000;
  --zeile: 58px; --pause: 20px; --zeitspalte: 50px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --fl: #1c1c20; --fl2: #18181b; --tx: #ececef; --mu: #9b9ba4; --li: #2d2d33;
    --ak: #86a8ff; --ak-text: #0d1430; --warn: #ff6e6e; --heute: rgba(134, 168, 255, .09);
    --gelb: #f2c230; --gruen: #5fd383; --orange: #ff9d47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --fl: #1c1c20; --fl2: #18181b; --tx: #ececef; --mu: #9b9ba4; --li: #2d2d33;
  --ak: #86a8ff; --ak-text: #0d1430; --warn: #ff6e6e; --heute: rgba(134, 168, 255, .09);
  --gelb: #f2c230; --gruen: #5fd383; --orange: #ff9d47;
  color-scheme: dark;
}
.g0 { --c: #2f6fdb; } .g1 { --c: #0f9488; } .g2 { --c: #5f9e1f; } .g3 { --c: #d08a00; }
.g4 { --c: #e0603a; } .g5 { --c: #d23f72; } .g6 { --c: #7c4ddb; } .g7 { --c: #2a8fb8; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--tx);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, select, input { font: inherit; color: inherit; }
.seite { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
header h1 small { color: var(--mu); font-weight: 450; margin-left: 6px; }
nav.tabs { display: flex; gap: 4px; background: var(--li); padding: 3px; border-radius: 9px; margin-left: auto; }
nav.tabs button {
  border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { background: var(--fl); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.badge {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px;
  background: var(--warn); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 600;
}
.badge.leise { background: var(--mu); }

.wochenleiste { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.wochenleiste button, .wochenleiste select, .werkzeugleiste select {
  border: 1px solid var(--li); background: var(--fl); border-radius: 8px; height: 34px; cursor: pointer;
}
.wochenleiste .pfeil { width: 36px; font-size: 18px; line-height: 1; }
.wochenleiste select { flex: 1; min-width: 0; padding: 0 8px; }
.wochenleiste .heute-knopf { padding: 0 12px; }

.raster {
  display: grid; grid-template-columns: var(--zeitspalte) repeat(5, minmax(0, 1fr));
  background: var(--fl); border: 1px solid var(--li); border-radius: 12px; overflow: hidden;
  position: relative;
}
.kopf {
  grid-row: 1; padding: 8px 4px 7px; text-align: center; border-bottom: 1px solid var(--li);
  font-size: 12px; color: var(--mu); background: var(--fl2);
}
.kopf b { display: block; color: var(--tx); font-size: 13px; }
.kopf.heute b { color: var(--ak); }
.kopf.heute::after {
  content: ""; display: block; height: 3px; width: 26px; margin: 4px auto 0; border-radius: 2px; background: var(--ak);
}
.ecke { grid-row: 1; grid-column: 1; border-bottom: 1px solid var(--li); background: var(--fl2); }
.zeit {
  grid-column: 1; padding: 5px 4px 0 6px; font-size: 11px; color: var(--mu); border-top: 1px solid var(--li);
  font-variant-numeric: tabular-nums;
}
.zeit b { display: block; font-size: 13px; color: var(--tx); }
.zeit.pause, .pausenband {
  border-top: 1px solid var(--li); background: repeating-linear-gradient(90deg, var(--fl2) 0 6px, transparent 6px 12px);
}
.pausenband { font-size: 10px; color: var(--mu); display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
.linie { border-top: 1px solid var(--li); border-left: 1px solid var(--li); }
.heute-spalte { background: var(--heute); grid-row: 2 / -1; pointer-events: none; }

.blk {
  position: relative; margin: 3px; padding: 4px 6px 5px; border-radius: 7px; overflow: hidden; cursor: pointer; text-align: left;
  border: 0; border-left: 3px solid var(--c);
  background: color-mix(in srgb, var(--c) 15%, var(--fl));
  font-size: 12px; line-height: 1.25; z-index: 1; min-width: 0;
}
.blk:hover { filter: brightness(.97); }
.blk:focus-visible { outline: 2px solid var(--ak); outline-offset: 1px; }
.blk b {
  display: block; font-size: 11px; font-weight: 650; color: color-mix(in srgb, var(--c) 70%, var(--tx));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 13px;
}
.blk span.text {
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto;
}
.blk .ic { position: absolute; top: 4px; right: 4px; width: 12px; height: 12px; display: block; }
.blk .ic svg { width: 100%; height: 100%; display: block; }
.ic.warn { color: var(--warn); } .ic.gelb { color: var(--gelb); } .ic.gruen { color: var(--gruen); }
.blk.frei { background: transparent; outline: 1px dashed color-mix(in srgb, var(--c) 55%, transparent); outline-offset: -1px; }
.blk.grob { background: color-mix(in srgb, var(--c) 7%, var(--fl)); outline: 1px dashed color-mix(in srgb, var(--c) 40%, transparent); outline-offset: -1px; }
.blk.entfaellt {
  border-left-color: var(--mu); color: var(--mu);
  background: repeating-linear-gradient(135deg, var(--li) 0 5px, transparent 5px 10px);
}
.blk.entfaellt b { color: var(--mu); text-decoration: line-through; }
.blk.wartend { outline: 1px dashed var(--mu); outline-offset: -1px; }
.blk.stand-wartet .ic { opacity: .5; }
.menue {
  position: fixed; z-index: 30; min-width: 190px; padding: 4px; border-radius: 10px;
  background: var(--fl); border: 1px solid var(--li); box-shadow: 0 6px 24px rgba(0,0,0,.18);
}
.menue button {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; border-radius: 7px;
  background: none; cursor: pointer; text-align: left; font-size: 13px;
}
.menue button:hover, .menue button:focus-visible { background: var(--fl2); outline: none; }
.menue .ic { display: inline-block; width: 13px; height: 13px; flex: none; }
.menue .ic svg { width: 100%; height: 100%; display: block; }
.detail dd .knopf { margin-top: 6px; }
.blk.konflikt { box-shadow: inset 0 0 0 2px var(--warn); }
.blk.konflikt span.text::before { content: "⚠ "; color: var(--warn); }
.pille {
  display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 6px; font-size: 9.5px; line-height: 13px;
  background: var(--tx); color: var(--fl); font-weight: 650; vertical-align: 1px;
}
.parallel { display: grid; grid-template-rows: subgrid; z-index: 1; min-width: 0; }
.parallel .blk { margin: 3px 1px; }
.blk.vergangen { opacity: .55; }
.blk.frei.vergangen { opacity: .35; }

.freitag {
  grid-row: 2 / -1; margin: 3px; border-radius: 9px; z-index: 1; display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 10px; color: var(--mu); font-weight: 600; font-size: 13px;
  background: repeating-linear-gradient(135deg, var(--fl2) 0 8px, var(--bg) 8px 16px);
  border: 1px solid var(--li);
}
.freitag.ferien { color: color-mix(in srgb, var(--ak) 70%, var(--mu)); }

.leerhinweis { color: var(--mu); text-align: center; padding: 40px 0; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--mu); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i.farbe { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: inline-block; }
.legende .ic { width: 12px; height: 12px; display: inline-block; }
.legende .ic svg { width: 100%; height: 100%; display: block; }

/* Listen (Offen, Ausfälle, ToDos) */
.karte { background: var(--fl); border: 1px solid var(--li); border-radius: 12px; overflow: hidden; }
.werkzeugleiste { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.werkzeugleiste select { padding: 0 8px; }
.werkzeugleiste .info { color: var(--mu); font-size: 13px; }
.werkzeugleiste .rechts { margin-left: auto; }
.knopf {
  border: 1px solid var(--li); background: var(--fl); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
}
.knopf.primaer { background: var(--ak); color: var(--ak-text); border-color: transparent; font-weight: 600; }
.knopf:disabled { opacity: .5; cursor: default; }
.tag-kopf {
  padding: 8px 14px; font-size: 12px; font-weight: 650; color: var(--mu); background: var(--fl2);
  border-top: 1px solid var(--li); text-transform: none;
}
.tag-kopf:first-child { border-top: 0; }
.tag-kopf.heute { color: var(--ak); }
.zeile {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 14px; border: 0; border-top: 1px solid var(--li);
  background: transparent; text-align: left; cursor: pointer;
}
.tag-kopf + .zeile { border-top: 0; }
.zeile:hover { background: var(--fl2); }
.zeile .farbe { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
.zeile .haupt { flex: 1; min-width: 0; }
.zeile .haupt b { font-weight: 600; }
.zeile .haupt small { display: block; color: var(--mu); font-size: 12px; overflow-wrap: anywhere; }
.zeile .std { color: var(--mu); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.zeile .ic { width: 15px; height: 15px; flex: none; display: block; }
.zeile .ic svg { width: 100%; height: 100%; display: block; }
.mehr { display: block; margin: 12px auto 0; }
.leer { padding: 22px 16px; color: var(--mu); text-align: center; }

.ausfall { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-top: 1px solid var(--li); }
.ausfall:first-child { border-top: 0; }
.ausfall .wann { flex: none; width: 120px; font-variant-numeric: tabular-nums; font-size: 13px; }
.ausfall .wann small { display: block; color: var(--mu); font-size: 12px; }
.ausfall .was { flex: 1; min-width: 0; }
.ausfall .was b { font-weight: 600; overflow-wrap: anywhere; }
.ausfall .was small { display: block; color: var(--mu); font-size: 12px; }
.ausfall .akt { display: flex; gap: 4px; flex: none; }
.ausfall.weg .was b, .ausfall.weg .wann { text-decoration: line-through; color: var(--mu); }
.marke { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--li); color: var(--tx); margin-top: 3px; }
.symbolknopf {
  border: 1px solid var(--li); background: var(--fl); border-radius: 7px; width: 30px; height: 30px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; padding: 0;
}
details.vergangen > summary { cursor: pointer; color: var(--mu); font-size: 13px; padding: 12px 2px 6px; }

.todo { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--li); }
.todo:first-child { border-top: 0; }
.todo input[type="checkbox"] { width: 18px; height: 18px; margin: 1px 0 0; flex: none; accent-color: var(--gruen); }
.todo .was { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.todo .bezug { display: inline-block; margin-top: 3px; font-size: 12px; color: var(--mu); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-align: left; }
.todo.erledigt .was > span { text-decoration: line-through; color: var(--mu); }
.neues-todo { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--li); background: var(--fl2); }
.neues-todo input[type="text"] { flex: 1 1 220px; min-width: 0; padding: 7px 10px; border: 1px solid var(--li); border-radius: 8px; background: var(--fl); }
.neues-todo select { flex: 1 1 200px; min-width: 0; padding: 7px 8px; border: 1px solid var(--li); border-radius: 8px; background: var(--fl); }
.abschnitt-titel { font-size: 13px; font-weight: 650; color: var(--mu); margin: 18px 2px 8px; }
.abschnitt-titel:first-child { margin-top: 0; }
.erledigt-kopf { margin: 18px 0 8px; }
.erledigt-kopf .abschnitt-titel { margin: 0 2px; }
.hinweisbox { background: var(--fl); border: 1px dashed var(--li); border-radius: 12px; padding: 12px 14px; color: var(--mu); font-size: 13px; margin-bottom: 10px; }
.hinweisbox button { margin-top: 8px; }

/* Hinweise */
.hinweise { background: var(--fl); border: 1px solid var(--li); border-radius: 12px; padding: 4px 16px; }
.hinweise h3 { font-size: 14px; margin: 14px 0 6px; }
.hinweise ul { margin: 0 0 12px; padding-left: 18px; }
.hinweise li { margin: 4px 0; overflow-wrap: anywhere; }

footer { margin-top: 18px; color: var(--mu); font-size: 12px; text-align: center; }
.fusslink { border: 0; background: none; color: var(--mu); text-decoration: underline; cursor: pointer; font-size: 12px; margin-left: 10px; }

/* Bottom-Sheet (Details, Formulare) */
.schleier { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; display: none; }
.schleier.offen { display: block; }
.detail {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); z-index: 11;
  width: min(520px, 100%); max-height: 88vh; overflow-y: auto; background: var(--fl); border-radius: 16px 16px 0 0;
  padding: 18px 20px calc(22px + env(safe-area-inset-bottom)); transition: transform .18s ease;
  box-shadow: 0 -6px 30px rgba(0,0,0,.2); visibility: hidden;
}
.detail.offen { transform: translate(-50%, 0); visibility: visible; }
.detail h2 { margin: 0 0 2px; font-size: 18px; display: flex; align-items: center; gap: 8px; padding-right: 36px; }
.detail h2 i.farbe { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.detail .unter { color: var(--mu); margin-bottom: 12px; font-size: 13px; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.detail dt { color: var(--mu); font-size: 13px; }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail dd .ic { display: inline-block; width: 13px; height: 13px; vertical-align: -1px; margin-right: 4px; }
.detail dd .ic svg { width: 100%; height: 100%; display: block; }
.detail .zu {
  position: absolute; top: 12px; right: 12px; border: 0; background: var(--li); width: 30px; height: 30px;
  border-radius: 50%; cursor: pointer; font-size: 16px; line-height: 1;
}
.detail .todos-stunde { margin-top: 14px; border-top: 1px solid var(--li); padding-top: 10px; }
.detail .todos-stunde h3 { font-size: 13px; color: var(--mu); margin: 0 0 4px; }
.detail .todos-stunde .todo { padding: 6px 0; border-top: 0; }
.detail .todos-stunde form { display: flex; gap: 8px; margin-top: 6px; }
.detail .todos-stunde input[type="text"] { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--li); border-radius: 8px; background: var(--bg); }
.warnung { color: var(--warn); font-weight: 600; }

.formular { display: grid; gap: 12px; }
.formular label.feld { display: grid; gap: 4px; font-size: 13px; color: var(--mu); }
.formular input[type="date"], .formular input[type="text"], .formular input[type="password"], .formular select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--li); border-radius: 8px; background: var(--bg); color: var(--tx); font-size: 15px;
}
.formular .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.formular .auswahl { display: flex; flex-wrap: wrap; gap: 6px; }
.formular .auswahl label {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid var(--li); border-radius: 8px;
  font-size: 13px; color: var(--tx); cursor: pointer;
}
.formular .aktionen { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.formular .fehler { color: var(--warn); font-size: 13px; min-height: 18px; }
.formular p { margin: 0; color: var(--mu); font-size: 13px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
  background: var(--tx); color: var(--fl); padding: 8px 14px; border-radius: 9px; font-size: 13px; max-width: calc(100% - 32px);
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
.toast.fehler { background: var(--warn); color: #fff; }

/* Passwort-Sperre */
.sperre { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.sperre form {
  width: min(360px, 100%); background: var(--fl); border: 1px solid var(--li); border-radius: 16px; padding: 24px 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}
.sperre h1 { font-size: 18px; margin: 0 0 4px; }
.sperre p { margin: 0 0 16px; color: var(--mu); font-size: 13px; }
.sperre input[type="password"] {
  width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 9px;
  border: 1px solid var(--li); background: var(--bg); color: var(--tx);
}
.sperre input[type="password"]:focus { outline: 2px solid var(--ak); outline-offset: 0; border-color: transparent; }
.sperre label.merken { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: 13px; }
.sperre button {
  width: 100%; border: 0; border-radius: 9px; padding: 10px; font-weight: 600; cursor: pointer;
  background: var(--ak); color: var(--ak-text);
}
.sperre button:disabled { opacity: .6; cursor: wait; }
.sperre .fehler { color: var(--warn); font-size: 13px; min-height: 18px; margin-top: 10px; }

/* Seitenleiste (nur breite Bildschirme, Reiter „Woche“) */
.seitenleiste { display: none; }
@media (min-width: 1280px) {
  .seite { max-width: 1480px; }
  #woche:not([hidden]) {
    display: grid; grid-template-columns: minmax(0, 1fr) 360px; column-gap: 16px; align-items: start;
  }
  #woche .wochenleiste { grid-column: 1; grid-row: 1; }
  #woche #raster { grid-column: 1; grid-row: 2; }
  #woche .legende { grid-column: 1; grid-row: 3; }
  /* Die Leiste trägt nichts zur Zeilenhöhe bei: Sie ist genau so hoch wie das Raster. */
  .seitenleiste { display: block; grid-column: 2; grid-row: 2; position: relative; align-self: stretch; }
  .sl-innen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; }
  .kachel {
    flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
    background: var(--fl); border: 1px solid var(--li); border-radius: 12px; overflow: hidden;
  }
  .kachel h3 {
    margin: 0; padding: 9px 14px; font-size: 13px; font-weight: 650; background: var(--fl2);
    border-bottom: 1px solid var(--li); flex: none; display: flex; align-items: center; gap: 4px;
  }
  .kachel-inhalt { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .kachel-inhalt .todo { padding: 8px 14px; }
  .kachel-inhalt .leer { padding: 18px 14px; font-size: 13px; }
  .kurz {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 14px; border: 0; border-top: 1px solid var(--li);
    background: transparent; text-align: left; cursor: pointer; font-size: 13px;
  }
  .kurz:first-child { border-top: 0; }
  .kurz:hover { background: var(--fl2); }
  .kurz .farbe { width: 4px; height: 18px; border-radius: 2px; background: var(--c); flex: none; }
  .kurz b { font-weight: 600; min-width: 52px; }
  .kurz .wann { flex: 1; color: var(--mu); font-variant-numeric: tabular-nums; }
  .kurz .ic { width: 14px; height: 14px; flex: none; display: block; }
  .kurz .ic svg { width: 100%; height: 100%; display: block; }
}

@media (max-width: 640px) {
  :root { --zeitspalte: 34px; --zeile: 62px; }
  .seite { padding: 10px 8px 32px; }
  header { padding: 0 4px; }
  nav.tabs { margin-left: 0; width: 100%; }
  nav.tabs button { flex: 1; padding: 6px 2px; font-size: 12.5px; }
  .zeit { padding: 4px 2px 0 3px; font-size: 9px; }
  .zeit b { font-size: 12px; }
  .zeit span { display: none; }
  .kopf { padding: 6px 1px 5px; font-size: 10px; }
  .kopf b { font-size: 12px; }
  .blk { margin: 2px; padding: 3px 4px 4px; font-size: 10.5px; border-left-width: 2px; border-radius: 5px; }
  .blk b { font-size: 10px; padding-right: 10px; }
  .blk .ic { width: 9px; height: 9px; top: 3px; right: 2px; }
  .pille { font-size: 8.5px; line-height: 11px; padding: 0 3px; margin-left: 2px; }
  .freitag { font-size: 11px; padding: 4px; }
  .ausfall { flex-wrap: wrap; }
  .ausfall .wann { width: auto; flex: 1 0 100%; }
}
@media print {
  nav.tabs, .wochenleiste button, footer { display: none; }
  body { background: #fff; }
}

const TAGNAME = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const vonIso = s => { const [y, m, t] = s.split("-").map(Number); return new Date(y, m - 1, t); };
const plus = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const montagVon = d => plus(d, -((d.getDay() + 6) % 7));
const kurz = d => `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.`;
const lang = d => kurz(d) + d.getFullYear();
const wtag = d => TAGNAME[(d.getDay() + 6) % 7];
const stdText = stds => stds.map(x => x + ".").join("+");
function kw(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - tag);
  const jahresanfang = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - jahresanfang) / 864e5 + 1) / 7);
}
function lesen(k) { try { return localStorage.getItem(k); } catch { return null; } }
function schreiben(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* ohne Speicher */ } }

const ICON = {
  check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.6l3.6 3.6 7.4-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2 15.3 14.3H.7z" fill="currentColor"/><path d="M8 5.8v4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="12.1" r="1" fill="#fff"/></svg>',
};
const PHASE = {
  0: { klasse: "warn", text: "noch nicht geplant", icon: ICON.warn },
  1: { klasse: "gelb", text: "grob geplant", icon: ICON.check },
  2: { klasse: "gruen", text: "final", icon: ICON.check },
};
const phaseIcon = p => `<i class="ic ${PHASE[p].klasse}" title="${PHASE[p].text}">${PHASE[p].icon}</i>`;

let toastTimer;
function meldung(text, fehler = false) {
  const t = document.getElementById("toast");
  t.textContent = text; t.className = "toast" + (fehler ? " fehler" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, fehler ? 6000 : 2600);
}

// =====================================================================
// ?heute=JJJJ-MM-TT simuliert ein anderes Datum (nur für Tests)
const heute = /^\d{4}-\d{2}-\d{2}$/.test(new URLSearchParams(location.search).get("heute") || "")
  ? vonIso(new URLSearchParams(location.search).get("heute")) : new Date();
heute.setHours(0, 0, 0, 0);
const heuteIso = iso(heute);
let D, KEY = null;
let TODOS = [], OPS = [], WARTEND = [], STAND = {};
let zeileVon, stundeVon, proTag, wochen, woche = 0, gruppeNr;
let offenTage = 28;
// Wo die Website ToDos und Eingaben speichert (vom Werkzeug je Ziel eingesetzt)
const SP = () => (D && D.speicher) || null;
const istPhp = () => !!SP() && SP().art === "php";
const TOKEN_NAMEN = { github: "kalender-github-token", php: "kalender-schreibschluessel" };
const tokenName = () => TOKEN_NAMEN[istPhp() ? "php" : "github"];
const token = () => lesen(tokenName());
const online = () => !!(KEY && SP());
const kannSchreiben = () => online() && !!token();

function vorbereiten() {
  zeileVon = {}; D.stunden.forEach((h, i) => zeileVon[h.nr] = i + 2);
  stundeVon = {}; D.stunden.forEach(h => stundeVon[h.nr] = h);
  proTag = {};
  for (const s of D.slots) (proTag[s.d] ??= []).push(s);
  gruppeNr = {}; D.gruppen.forEach((g, i) => gruppeNr[g.name] = i);
  const erstesMo = vonIso(D.von), letztesMo = montagVon(vonIso(D.bis));
  wochen = [];
  for (let m = erstesMo; m <= letztesMo; m = plus(m, 7)) wochen.push(m);
}

// ---------- Ausfälle (gleiche Regeln wie build.py)
const normal = e => ({ ...e, von: e.datum || e.von, bis: e.datum || e.bis || e.von });
function trifft(a, s) {
  if (s.d < a.von || s.d > a.bis) return false;
  const g = D.gruppen[s.g];
  if (a.jahrgaenge && !a.jahrgaenge.includes(g.jahrgang)) return false;
  if (a.lerngruppen && !a.lerngruppen.includes(g.name)) return false;
  if (a.stunden && !a.stunden.includes(s.s)) return false;
  if (a.ab_stunde != null && s.s < a.ab_stunde) return false;
  if (a.bis_stunde != null && s.s > a.bis_stunde) return false;
  if (a.nachmittag && s.s < D.nachmittag_ab) return false;
  return true;
}
function opsGeaendert() {
  WARTEND = OPS.filter(o => o.art === "neu" || o.art === "aendern").map(o => normal(o.eintrag));
  // Noch nicht übernommene Stand-Änderungen je Stunde (Datum|Lerngruppe|Stunde -> grob/final)
  STAND = {};
  for (const o of OPS.filter(o => o.art === "stand").sort((a, b) => (a.zeit || "").localeCompare(b.zeit || "")))
    for (const x of o.s) STAND[`${o.d}|${o.g}|${x}`] = o.stand;
}
function anzeige(s) {
  if (s.st === "frei" || s.st === "geplant") {
    const w = WARTEND.find(a => trifft(a, s));
    if (w) return { ...s, st: "wartend", grund: w.grund };
  }
  if (s.st === "geplant") {
    const neu = STAND[`${s.d}|${D.gruppen[s.g].name}|${s.s}`];
    if (neu) return { ...s, p: neu === "final" ? 2 : 1, standWartet: true };
  }
  return s;
}
function umfangText(a) {
  let std = "ganzer Tag";

  else if (a.stunden) std = stdText(a.stunden) + " Std.";
  else if (a.ab_stunde != null) std = `ab ${a.ab_stunde}. Std.`;
  else if (a.bis_stunde != null) std = `bis ${a.bis_stunde}. Std.`;
  let wer = "alle Lerngruppen";
  if (a.jahrgaenge) wer = "Jg. " + a.jahrgaenge.join(", ");
  if (a.lerngruppen) wer = a.lerngruppen.join(", ");
  return `${std} · ${wer}`;
}
function datumText(a) {
  const v = vonIso(a.von), b = vonIso(a.bis);
  return a.von === a.bis ? `${wtag(v).slice(0, 2)}, ${lang(v)}` : `${kurz(v)}–${lang(b)}`;
}

// ---------- ToDos
function todosZu(d, stds, gname) {
  return TODOS.filter(t => !t.erledigt && t.stunde && t.stunde.d === d && t.stunde.g === gname && t.stunde.s.some(x => stds.includes(x)));
}
function bezugText(st) {
  const d = vonIso(st.d);
  return `${st.g} · ${wtag(d).slice(0, 2)} ${lang(d)} · ${stdText(st.s)} Std.`;
}

// =====================================================================
// Woche
// =====================================================================
function startWoche() {
  let ziel = heute;
  if (heute.getDay() === 6) ziel = plus(heute, 2);
  if (heute.getDay() === 0) ziel = plus(heute, 1);
  return wocheVon(ziel);
}
function wocheVon(d) {
  const m = iso(montagVon(d));
  const i = wochen.findIndex(w => iso(w) === m);
  if (i >= 0) return i;
  return m < iso(wochen[0]) ? 0 : wochen.length - 1;
}
function tagesblock(d) {
  const t = D.tage[iso(d)];
  if (!t) return null;
  if (t.art === "ausfall" && (proTag[iso(d)] || []).some(s => s.st === "konflikt")) return null;
  return t;
}

// Fasst aufeinanderfolgende Stunden einer Lerngruppe mit gleichem Inhalt zusammen
function bloeckeVon(liste) {
  const sortiert = liste.slice().sort((a, b) => a.d.localeCompare(b.d) || a.g - b.g || a.s - b.s);
  const bloecke = [];
  for (let i = 0; i < sortiert.length;) {
    const a = sortiert[i];
    let j = i + 1;
    while (j < sortiert.length) {
      const b = sortiert[j], vor = sortiert[j - 1];
      if (b.d !== a.d || b.g !== a.g || b.st !== a.st || b.thema !== a.thema || b.grund !== a.grund || b.p !== a.p || (b.lz || "") !== (a.lz || "") || zeileVon[b.s] !== zeileVon[vor.s] + 1) break;
      j++;
    }
    bloecke.push(sortiert.slice(i, j));
    i = j;
  }
  return bloecke;
}

function kachel(teil, style) {
  const a = teil[0], g = D.gruppen[a.g];
  const vergangen = a.d < heuteIso;
  let klasse, text = "", icon = "";
  if (a.st === "frei") { klasse = "frei"; if (!vergangen) icon = phaseIcon(0); }
  else if (a.st === "geplant") { klasse = (a.p === 2 ? "final" : "grob") + (a.standWartet ? " stand-wartet" : ""); text = esc(a.thema); icon = phaseIcon(a.p === 2 ? 2 : 1); }
  else if (a.st === "entfaellt") { klasse = "entfaellt"; text = esc(a.grund); }
  else if (a.st === "wartend") { klasse = "entfaellt wartend"; text = `${esc(a.grund)} · wird übernommen`; }
  else { klasse = "konflikt"; text = `${esc(a.thema)} – entfällt: ${esc(a.grund)}`; }
  const n = todosZu(a.d, teil.map(x => x.s), g.name).length;
  const pille = n ? `<span class="pille" title="${n} offene ToDo(s)">${n}</span>` : "";
  return `<button class="blk g${a.g % 8} ${klasse}${vergangen ? " vergangen" : ""}" style="${style}" data-d="${a.d}" data-s="${teil.map(x => x.s).join(",")}" data-g="${a.g}"><b>${esc(g.name)}${pille}</b><span class="text">${text}</span>${icon}</button>`;
}

function zeichneWoche() {
  const mo = wochen[woche];
  const wahl = document.getElementById("wochenwahl");
  wahl.value = woche;
  history.replaceState(null, "", "#" + iso(mo));
  document.getElementById("zurueck").disabled = woche === 0;
  document.getElementById("vor").disabled = woche === wochen.length - 1;

  const r = [`<div class="ecke"></div>`];
  for (let k = 0; k < 5; k++) {
    const d = plus(mo, k);
    const istHeute = iso(d) === heuteIso;
    r.push(`<div class="kopf${istHeute ? " heute" : ""}" style="grid-column:${k + 2}"><b>${TAGNAME[k].slice(0, 2)}</b>${kurz(d)}</div>`);
    if (istHeute) r.push(`<div class="heute-spalte" style="grid-column:${k + 2}"></div>`);
  }
  D.stunden.forEach(h => {
    const z = zeileVon[h.nr];
    if (h.unterricht) {
      r.push(`<div class="zeit" style="grid-row:${z}"><b>${h.nr}.</b><span>${h.von}</span></div>`);
      for (let k = 0; k < 5; k++) r.push(`<div class="linie" style="grid-row:${z};grid-column:${k + 2}"></div>`);
    } else {
      r.push(`<div class="zeit pause" style="grid-row:${z}"></div>`);
      r.push(`<div class="pausenband" style="grid-row:${z};grid-column:2 / -1">${esc(h.name)} · ${h.von}–${h.bis}</div>`);
    }
  });

  let k = 0;
  while (k < 5) {
    const d = plus(mo, k);
    const t = tagesblock(d);
    if (t) {
      let j = k + 1;
      while (j < 5) {
        const u = tagesblock(plus(mo, j));
        if (!u || u.art !== t.art || u.name !== t.name) break;
        j++;
      }
      r.push(`<div class="freitag ${t.art}" style="grid-column:${k + 2} / ${j + 2}">${esc(t.name)}</div>`);
      k = j;
      continue;
    }
    const bloecke = bloeckeVon((proTag[iso(d)] || []).map(anzeige)).map(teil => ({
      teil, z1: zeileVon[teil[0].s], z2: zeileVon[teil[teil.length - 1].s] + 1,
    })).sort((a, b) => a.z1 - b.z1);
    // Überschneidende Blöcke nebeneinander darstellen
    for (let i = 0; i < bloecke.length;) {
      let ende = bloecke[i].z2, j = i + 1;
      while (j < bloecke.length && bloecke[j].z1 < ende) { ende = Math.max(ende, bloecke[j].z2); j++; }
      const gruppe = bloecke.slice(i, j);
      if (gruppe.length === 1) {
        r.push(kachel(gruppe[0].teil, `grid-column:${k + 2};grid-row:${gruppe[0].z1} / ${gruppe[0].z2}`));
      } else {
        const z0 = gruppe[0].z1;
        r.push(`<div class="parallel" style="grid-column:${k + 2};grid-row:${z0} / ${ende};grid-template-columns:repeat(${gruppe.length}, minmax(0, 1fr))">` +
          gruppe.map((b, n) => kachel(b.teil, `grid-column:${n + 1};grid-row:${b.z1 - z0 + 1} / ${b.z2 - z0 + 1}`)).join("") + `</div>`);
      }
      i = j;
    }
    k++;
  }
  document.getElementById("raster").innerHTML =
    `<div class="raster" style="grid-template-rows:auto ${D.stunden.map(h => h.unterricht ? "minmax(var(--zeile), auto)" : "var(--pause)").join(" ")}">${r.join("")}</div>`;
}

function zeichneWochenwahl() {
  document.getElementById("wochenwahl").innerHTML = wochen.map((m, i) => {
    const namen = [...new Set([0, 1, 2, 3, 4].map(k => D.tage[iso(plus(m, k))]).filter(t => t && t.art === "ferien").map(t => t.name))];
    return `<option value="${i}">KW ${kw(m)} · ${kurz(m)}–${lang(plus(m, 4))}${namen.length ? " · " + esc(namen.join(", ")) : ""}</option>`;
  }).join("");
  document.getElementById("legende").innerHTML = D.gruppen.map((g, i) =>
    `<span class="g${i % 8}"><i class="farbe"></i>${esc(g.name)}</span>`).join("") +
    [0, 1, 2].map(p => `<span>${phaseIcon(p)}${PHASE[p].text}</span>`).join("");
}

function zuWoche(d) {
  woche = wocheVon(vonIso(d));
  zeigeTab("woche");
  zeichneWoche();
}

// Detailansicht und Sheet
// =====================================================================
const detail = () => document.getElementById("detail");
function sheetOeffnen(html) {
  document.getElementById("detailinhalt").innerHTML = html;
  detail().classList.add("offen"); document.getElementById("schleier").classList.add("offen");
}
function schliessen() { detail().classList.remove("offen"); document.getElementById("schleier").classList.remove("offen"); }

function stundeOeffnen(d, stds, g) {
  const alle = (proTag[d] || []).filter(x => x.g === g && stds.includes(x.s)).map(anzeige).sort((a, b) => a.s - b.s);
  if (!alle.length) return;
  const s = alle[0], gr = D.gruppen[g], datum = vonIso(d);
  const h1 = stundeVon[stds[0]], h2 = stundeVon[stds[stds.length - 1]];
  const reihe = s.r >= 0 ? D.reihen[s.r] : null;
  const zeilen = [["Zeit", `${stdText(stds)} Stunde · ${h1.von}–${h2.bis}`]];
  if (s.st === "geplant" || s.st === "konflikt") zeilen.push(["Thema", esc(s.thema)]);
  if (reihe) {
    zeilen.push(["Reihe", esc(reihe.titel)]);
    if (reihe.leitfrage) zeilen.push(["Leitfrage", esc(reihe.leitfrage)]);
  }
  // optionales Feld – ältere Planungen und ältere Daten haben es nicht
  if (s.lz && (s.st === "geplant" || s.st === "konflikt")) zeilen.push(["Schwerpunktlernziel", esc(s.lz)]);
  if (s.st === "frei") zeilen.push(["Stand", `${phaseIcon(0)}noch nicht geplant`]);
  if (s.st === "geplant") {
    const p = s.p === 2 ? 2 : 1;
    const knopf = kannSchreiben() ? `<br><button class="knopf" data-stand="${p === 2 ? "grob" : "final"}">${p === 2 ? "Auf grob zurücksetzen" : "Als final markieren"}</button>` : "";
    zeilen.push(["Stand", `${phaseIcon(p)}${PHASE[p].text}${s.standWartet ? ` <span class="marke">wird übernommen</span>` : ""}${knopf}`]);
  }
  if (s.st === "entfaellt") zeilen.push(["Status", `entfällt: ${esc(s.grund)}`]);
  if (s.st === "wartend") zeilen.push(["Status", `entfällt: ${esc(s.grund)} (wird übernommen)`]);
  if (s.st === "konflikt") zeilen.push(["Status", `<span class="warnung">Konflikt – Stunde entfällt: ${esc(s.grund)}</span>`]);

  const todos = todosZu(d, stds, gr.name);
  const todoHtml = `<div class="todos-stunde"><h3>ToDos zu dieser Stunde</h3>
    ${todos.length ? todos.map(t => todoZeile(t)).join("") : `<div style="color:var(--mu);font-size:13px">Keine.</div>`}
    ${kannSchreiben() ? `<form id="stundentodo"><input type="text" id="stundentodotext" placeholder="Neues ToDo …" maxlength="300" required><button class="knopf primaer">Hinzufügen</button></form>` : ""}
  </div>`;

  sheetOeffnen(`<h2 id="detailtitel" class="g${g % 8}"><i class="farbe"></i>${esc(gr.name)}</h2>
     <div class="unter">${esc(gr.fach)} · ${wtag(datum)}, ${lang(datum)}</div>
     <dl>${zeilen.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>${todoHtml}`);
  const form = document.getElementById("stundentodo");
  if (form) form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = document.getElementById("stundentodotext").value.trim();
    if (!text) return;
    await todoNeu(text, { d, s: stds, g: gr.name });
    stundeOeffnen(d, stds, g);
  });
  const standKnopf = document.querySelector("#detailinhalt [data-stand]");
  if (standKnopf) standKnopf.addEventListener("click", async () => {
    standKnopf.disabled = true;
    if (await standSetzen(d, stds, g, standKnopf.dataset.stand)) stundeOeffnen(d, stds, g);
    else standKnopf.disabled = false;
  });
}

// Stand einer geplanten Stunde (grob/final) über den Eingang ändern; das Werkzeug trägt ihn in die Planungsdatei ein.
// Wer zum ursprünglichen Stand zurückkehrt, nimmt die noch nicht übernommene Änderung nur zurück.
async function standSetzen(d, stds, g, stand) {
  const gname = D.gruppen[g].name;
  const ursprung = (proTag[d] || []).find(x => x.g === g && x.s === stds[0]);
  const zurueck = stand === (ursprung && ursprung.p === 2 ? "final" : "grob");
  return eingangAendern(w => {
    w.ops = w.ops.filter(o => !(o.art === "stand" && o.d === d && o.g === gname && o.s.some(x => stds.includes(x))));
    if (!zurueck) w.ops.push({ id: crypto.randomUUID(), art: "stand", d, s: stds, g: gname, stand, zeit: new Date().toISOString() });
  }, zurueck ? "Änderung zurückgenommen" : `${stand === "final" ? "Als final markiert" : "Auf grob gesetzt"} – wird übernommen`);
}

// Rechtsklick auf eine geplante Stunde (Raster, Offen, Seitenleiste): kleines Menü zum Ändern des Stands
function standMenue(e) {
  const b = e.target.closest(".blk, .zeile[data-d], .kurz");
  if (!b || !kannSchreiben()) return;
  const d = b.dataset.d, stds = b.dataset.s.split(",").map(Number), g = Number(b.dataset.g);
  const s = (proTag[d] || []).filter(x => x.g === g && x.s === stds[0]).map(anzeige)[0];
  if (!s || s.st !== "geplant") return;
  e.preventDefault();
  menueZu();
  const ziel = s.p === 2 ? "grob" : "final";
  const m = document.createElement("div");
  m.className = "menue"; m.id = "menue"; m.setAttribute("role", "menu");
  m.innerHTML = `<button role="menuitem" data-wahl="stand">${phaseIcon(ziel === "final" ? 2 : 1)}${ziel === "final" ? "Als final markieren" : "Auf grob zurücksetzen"}</button>
    <button role="menuitem" data-wahl="details">Details öffnen</button>`;
  document.body.appendChild(m);
  const breite = m.offsetWidth, hoehe = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(e.clientX, innerWidth - breite - 8)) + "px";
  m.style.top = Math.max(8, Math.min(e.clientY, innerHeight - hoehe - 8)) + "px";
  m.addEventListener("click", async ev => {
    const wahl = ev.target.closest("[data-wahl]");
    if (!wahl) return;
    menueZu();
    if (wahl.dataset.wahl === "stand") await standSetzen(d, stds, g, ziel);
    else stundeOeffnen(d, stds, g);
  });
  m.querySelector("button").focus();
}
function menueZu() { const m = document.getElementById("menue"); if (m) m.remove(); }

// =====================================================================
// Offene Stunden
// =====================================================================
function zeichneOffen() {
  const box = document.getElementById("offen");
  const filter = lesen("kalender-offen-filter") ?? "";
  const grenze = iso(plus(heute, offenTage));
  const alle = D.slots.filter(s => s.d >= heuteIso).map(anzeige)
    .filter(s => s.st === "frei" || (s.st === "geplant" && s.p !== 2))
    .filter(s => filter === "" || s.g === Number(filter));
  const ungeplant = alle.filter(s => s.st === "frei").length, grob = alle.length - ungeplant;

  const proD = {};
  for (const s of alle.filter(s => s.d <= grenze)) (proD[s.d] ??= []).push(s);
  const tage = Object.keys(proD).sort();
  const liste = tage.map(d => {
    const datum = vonIso(d);
    const zeilen = bloeckeVon(proD[d]).sort((a, b) => a[0].s - b[0].s).map(teil => {
      const a = teil[0], g = D.gruppen[a.g], p = a.st === "frei" ? 0 : 1;
      return `<button class="zeile g${a.g % 8}" data-d="${a.d}" data-s="${teil.map(x => x.s).join(",")}" data-g="${a.g}">
        <span class="farbe"></span>
        <span class="haupt"><b>${esc(g.name)}</b><small>${a.st === "frei" ? "noch kein Thema" : esc(a.thema)}</small></span>
        <span class="std">${stdText(teil.map(x => x.s))} Std.</span>${phaseIcon(p)}</button>`;
    }).join("");
    return `<div class="tag-kopf${d === heuteIso ? " heute" : ""}">${d === heuteIso ? "Heute, " : ""}${wtag(datum)}, ${lang(datum)}</div>${zeilen}`;
  }).join("");

  box.innerHTML = `
    <div class="werkzeugleiste">
      <select id="offenfilter" aria-label="Lerngruppe filtern">
        <option value="">Alle Lerngruppen</option>
        ${D.gruppen.map((g, i) => `<option value="${i}"${String(i) === filter ? " selected" : ""}>${esc(g.name)}</option>`).join("")}
      </select>
      <span class="info">Bis Schuljahresende: ${phaseIcon(0)} ${ungeplant} Std. nicht geplant · ${phaseIcon(1)} ${grob} Std. grob geplant</span>
    </div>
    <div class="karte">${liste || `<div class="leer">Keine offenen Stunden in den nächsten ${offenTage} Tagen.</div>`}</div>
    ${alle.some(s => s.d > grenze) ? `<button class="knopf mehr" id="offenmehr">Weitere 4 Wochen anzeigen</button>` : ""}`;
  box.querySelectorAll(".info .ic").forEach(i => { i.style.cssText = "display:inline-block;width:13px;height:13px;vertical-align:-2px"; });
  document.getElementById("offenfilter").addEventListener("change", e => { schreiben("kalender-offen-filter", e.target.value); zeichneOffen(); });
  const mehr = document.getElementById("offenmehr");
  if (mehr) mehr.addEventListener("click", () => { offenTage += 28; zeichneOffen(); });
}

// =====================================================================
// Ausfälle
// =====================================================================
function zeichneAusfaelle() {
  const box = document.getElementById("ausfaelle");
  const darf = kannSchreiben();
  const bestehend = D.ausfaelle.map(a => ({ ...a, op: OPS.find(o => o.ziel === a.id) }));
  const neue = OPS.filter(o => o.art === "neu").map(o => ({ ...normal(o.eintrag), neuOp: o }));
  const alle = [...bestehend, ...neue].sort((a, b) => a.von.localeCompare(b.von) || a.bis.localeCompare(b.bis));
  const kommend = alle.filter(a => a.bis >= heuteIso), vergangen = alle.filter(a => a.bis < heuteIso);

  const zeile = a => {
    const op = a.neuOp || a.op;
    const zeige = a.op && a.op.art === "aendern" ? normal(a.op.eintrag) : a;
    let marke = "", akt = "";
    if (a.neuOp) marke = `<span class="marke">wird übernommen</span>`;
    else if (a.op && a.op.art === "aendern") marke = `<span class="marke">Änderung wird übernommen</span>`;
    else if (a.op && a.op.art === "loeschen") marke = `<span class="marke">wird gelöscht</span>`;
    if (darf) {
      akt = op
        ? `<button class="symbolknopf" data-rueck="${op.id}" title="Rückgängig" aria-label="Rückgängig">↶</button>`
        : `<button class="symbolknopf" data-bearb="${a.id}" title="Bearbeiten" aria-label="Bearbeiten">✎</button><button class="symbolknopf" data-loesch="${a.id}" title="Löschen" aria-label="Löschen">🗑</button>`;
    }
    return `<div class="ausfall${a.op && a.op.art === "loeschen" ? " weg" : ""}">
      <div class="wann">${datumText(zeige)}</div>
      <div class="was"><b>${esc(zeige.grund)}</b><small>${esc(umfangText(zeige))}</small>${marke}</div>
      <div class="akt">${akt}</div></div>`;
  };

  box.innerHTML = `
    ${online() && !darf ? `<div class="hinweisbox">Zum Eintragen und Bearbeiten muss dieses Gerät einmal freigeschaltet werden.<br><button class="knopf" data-freischalten>Bearbeiten freischalten</button></div>` : ""}
    ${!online() ? `<div class="hinweisbox">Ausfälle lassen sich nur in der Online-Ansicht${SP() ? ` (<a href="${esc(SP().url)}">${esc(SP().url)}</a>)` : ""} bearbeiten.</div>` : ""}
    <div class="werkzeugleiste"><span class="info">Kommende Ausfälle</span>
      ${darf ? `<button class="knopf primaer rechts" id="neuausfall">Neuer Ausfall</button>` : ""}</div>
    <div class="karte">${kommend.map(zeile).join("") || `<div class="leer">Keine kommenden Ausfälle.</div>`}</div>
    ${vergangen.length ? `<details class="vergangen"><summary>Vergangene Ausfälle (${vergangen.length})</summary><div class="karte">${vergangen.reverse().map(zeile).join("")}</div></details>` : ""}`;

  const neu = document.getElementById("neuausfall");
  if (neu) neu.addEventListener("click", () => ausfallFormular(null));
  box.querySelectorAll("[data-bearb]").forEach(b => b.addEventListener("click", () => ausfallFormular(D.ausfaelle.find(a => a.id === b.dataset.bearb))));
  box.querySelectorAll("[data-loesch]").forEach(b => b.addEventListener("click", async () => {
    const a = D.ausfaelle.find(x => x.id === b.dataset.loesch);
    if (!confirm(`Ausfall „${a.grund}“ (${datumText(a)}) löschen?`)) return;
    await eingangAendern(w => { w.ops.push({ id: crypto.randomUUID(), art: "loeschen", ziel: a.id, zeit: new Date().toISOString() }); }, "Löschung gespeichert – wird übernommen");
  }));
  box.querySelectorAll("[data-rueck]").forEach(b => b.addEventListener("click", async () => {
    await eingangAendern(w => { w.ops = w.ops.filter(o => o.id !== b.dataset.rueck); }, "Rückgängig gemacht");
  }));
  box.querySelectorAll("[data-freischalten]").forEach(b => b.addEventListener("click", freischaltenFormular));
}

function ausfallFormular(vorlage) {
  const v = vorlage ? normal(vorlage) : { von: heuteIso, bis: heuteIso };
  const art = v.nachmittag ? "nachmittag" : v.stunden ? "stunden" : v.ab_stunde != null ? "ab" : v.bis_stunde != null ? "bis" : "ganz";
  const wer = v.lerngruppen ? "lerngruppen" : v.jahrgaenge ? "jahrgaenge" : "alle";
  const unterricht = D.stunden.filter(h => h.unterricht);
  const jahrgaenge = [...new Set(D.gruppen.map(g => g.jahrgang))].sort((a, b) => a - b);
  const kaestchen = (name, werte, gewaehlt, text) => werte.map(w =>
    `<label><input type="checkbox" name="${name}" value="${esc(w)}"${(gewaehlt || []).includes(w) ? " checked" : ""}>${esc(text(w))}</label>`).join("");
  const stundenauswahl = (id, wert) => `<select id="${id}">${unterricht.map(h => `<option value="${h.nr}"${h.nr === wert ? " selected" : ""}>${h.nr}. Stunde (${h.von})</option>`).join("")}</select>`;

  sheetOeffnen(`<h2 id="detailtitel">${vorlage ? "Ausfall bearbeiten" : "Neuer Ausfall"}</h2>
    <div class="unter">Wird beim nächsten Abgleich (spätestens nach 15 Minuten) in den Kalender übernommen.</div>
    <form class="formular" id="ausfallform" novalidate>
      <div class="zwei">
        <label class="feld">Von<input type="date" id="af-von" value="${v.von}" required></label>
        <label class="feld">Bis (optional)<input type="date" id="af-bis" value="${v.bis !== v.von ? v.bis : ""}"></label>
      </div>
      <label class="feld">Welche Stunden?
        <select id="af-art">
          <option value="ganz"${art === "ganz" ? " selected" : ""}>Ganzer Tag</option>
          <option value="stunden"${art === "stunden" ? " selected" : ""}>Bestimmte Stunden</option>
          <option value="ab"${art === "ab" ? " selected" : ""}>Ab einer Stunde</option>
          <option value="bis"${art === "bis" ? " selected" : ""}>Bis zu einer Stunde</option>
          <option value="nachmittag"${art === "nachmittag" ? " selected" : ""}>Nachmittag (ab ${D.nachmittag_ab}. Stunde)</option>
        </select></label>
      <div class="auswahl" id="af-stunden" ${art === "stunden" ? "" : "hidden"}>${kaestchen("std", unterricht.map(h => h.nr), v.stunden, n => n + ".")}</div>
      <div id="af-ab" ${art === "ab" ? "" : "hidden"}>${stundenauswahl("af-abwert", v.ab_stunde)}</div>
      <div id="af-bisstd" ${art === "bis" ? "" : "hidden"}>${stundenauswahl("af-biswert", v.bis_stunde)}</div>
      <label class="feld">Wer ist betroffen?
        <select id="af-wer">
          <option value="alle"${wer === "alle" ? " selected" : ""}>Alle Lerngruppen</option>
          <option value="jahrgaenge"${wer === "jahrgaenge" ? " selected" : ""}>Bestimmte Jahrgänge</option>
          <option value="lerngruppen"${wer === "lerngruppen" ? " selected" : ""}>Bestimmte Lerngruppen</option>
        </select></label>
      <div class="auswahl" id="af-jg" ${wer === "jahrgaenge" ? "" : "hidden"}>${kaestchen("jg", jahrgaenge, v.jahrgaenge, j => "Jg. " + j)}</div>
      <div class="auswahl" id="af-lg" ${wer === "lerngruppen" ? "" : "hidden"}>${kaestchen("lg", D.gruppen.map(g => g.name), v.lerngruppen, n => n)}</div>
      <label class="feld">Grund<input type="text" id="af-grund" value="${esc(v.grund || "")}" maxlength="120" placeholder="z. B. Wandertag" required></label>
      <div class="fehler" id="af-fehler" role="alert"></div>
      <div class="aktionen"><button type="button" class="knopf" id="af-abbrechen">Abbrechen</button><button class="knopf primaer" id="af-speichern">Speichern</button></div>
    </form>`);

  const $ = id => document.getElementById(id);
  $("af-art").addEventListener("change", e => {
    $("af-stunden").hidden = e.target.value !== "stunden"; $("af-ab").hidden = e.target.value !== "ab"; $("af-bisstd").hidden = e.target.value !== "bis";
  });
  $("af-wer").addEventListener("change", e => { $("af-jg").hidden = e.target.value !== "jahrgaenge"; $("af-lg").hidden = e.target.value !== "lerngruppen"; });
  $("af-abbrechen").addEventListener("click", schliessen);
  $("ausfallform").addEventListener("submit", async e => {
    e.preventDefault();
    const fehler = t => { $("af-fehler").textContent = t; };
    const von = $("af-von").value, bis = $("af-bis").value || von, grund = $("af-grund").value.trim();
    if (!von) return fehler("Bitte ein Datum angeben.");
    if (bis < von) return fehler("Das Ende liegt vor dem Beginn.");
    if (!grund) return fehler("Bitte einen Grund angeben.");
    const eintrag = von === bis ? { datum: von } : { von, bis };
    const gewaehlt = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
    const a = $("af-art").value;
    if (a === "stunden") { const s = gewaehlt("std").map(Number); if (!s.length) return fehler("Bitte mindestens eine Stunde wählen."); eintrag.stunden = s; }
    if (a === "ab") eintrag.ab_stunde = Number($("af-abwert").value);
    if (a === "bis") eintrag.bis_stunde = Number($("af-biswert").value);
    if (a === "nachmittag") eintrag.nachmittag = true;
    const w = $("af-wer").value;
    if (w === "jahrgaenge") { const j = gewaehlt("jg").map(Number); if (!j.length) return fehler("Bitte mindestens einen Jahrgang wählen."); eintrag.jahrgaenge = j; }
    if (w === "lerngruppen") { const l = gewaehlt("lg"); if (!l.length) return fehler("Bitte mindestens eine Lerngruppe wählen."); eintrag.lerngruppen = l; }
    eintrag.grund = grund;
    const op = { id: crypto.randomUUID(), art: vorlage ? "aendern" : "neu", eintrag, zeit: new Date().toISOString() };
    if (vorlage) op.ziel = vorlage.id;
    $("af-speichern").disabled = true;
    const ok = await eingangAendern(w => { w.ops.push(op); }, "Gespeichert – wird übernommen");
    if (ok) schliessen(); else $("af-speichern").disabled = false;
  });
}

// Seitenleiste neben dem Wochenraster (nur auf breiten Bildschirmen sichtbar)

  const offen = TODOS.filter(t => !t.erledigt);

  document.getElementById("sl-todoanzahl").innerHTML = offen.length ? `<span class="badge leise">${offen.length}</span>` : "";
  document.getElementById("sl-todos").innerHTML =
    [...mit, ...ohne].map(t => todoZeile(t, true)).join("") || `<div class="leer">Keine offenen ToDos.</div>`;

  const grenze = iso(plus(heute, 6));
  const stunden = D.slots.filter(s => s.d >= heuteIso && s.d <= grenze).map(anzeige)
    .filter(s => s.st === "frei" || (s.st === "geplant" && s.p !== 2));
  document.getElementById("sl-offen").innerHTML = bloeckeVon(stunden)
    .sort((a, b) => a[0].d.localeCompare(b[0].d) || a[0].s - b[0].s)
    .map(teil => {

    }).join("") || `<div class="leer">Keine offenen Stunden in den nächsten 7 Tagen.</div>`;
}

  const ohne = offen.filter(t => !t.stunde).sort((a, b) => (a.erstellt || "").localeCompare(b.erstellt || ""));

  // Auswahl von Stunden der nächsten sechs Wochen zum Verknüpfen
  const grenze = iso(plus(heute, 42));
  const optionen = bloeckeVon(D.slots.filter(s => s.d >= heuteIso && s.d <= grenze && (s.st === "frei" || s.st === "geplant")))

  box.innerHTML = `

    ${!online() ? `<div class="hinweisbox">ToDos lassen sich nur in der Online-Ansicht${SP() ? ` (<a href="${esc(SP().url)}">${esc(SP().url)}</a>)` : ""} bearbeiten. Angezeigt wird der Stand der letzten Aktualisierung.</div>` : ""}
    <div class="karte">
      ${darf ? `<form class="neues-todo" id="todoform">
        <input type="text" id="todotext" placeholder="Neues ToDo …" maxlength="300" required>
        <select id="todostunde" aria-label="Mit Stunde verknüpfen"><option value="">Ohne Stunde</option>${optionen}</select>
        <button class="knopf primaer">Hinzufügen</button></form>` : ""}
      ${mit.length ? `<div class="tag-kopf">Mit Stunde</div>${mit.map(t => todoZeile(t)).join("")}` : ""}
      ${ohne.length ? `<div class="tag-kopf">Allgemein</div>${ohne.map(t => todoZeile(t)).join("")}` : ""}
      ${!offen.length ? `<div class="leer">Keine offenen ToDos.</div>` : ""}
    </div>
    ${erledigt.length ? `<div class="werkzeugleiste erledigt-kopf"><span class="abschnitt-titel">Erledigt (${erledigt.length})</span>
        ${darf ? `<button class="knopf rechts" id="erledigteweg">Alle erledigten löschen</button>` : ""}</div>
      <div class="karte">${erledigt.map(t => todoZeile(t)).join("")}</div>` : ""}`;

  const form = document.getElementById("todoform");
  if (form) form.addEventListener("submit", async e => {

// =====================================================================
// Speicher für ToDos und Eingaben (nur Online-Ansicht):
// daten.php auf dem eigenen Webspace (art "php") oder ein GitHub-Repository (art "github")
// =====================================================================
const API = "https://api.github.com";
const EINGANG = "eingang", TODODATEI = "todos";
class Konflikt extends Error {}

function githubKopf() {
  const h = { "Accept": "application/vnd.github+json" };
  const t = token();
  if (t) h.Authorization = "Bearer " + t;
  return h;
}
const githubUrl = name => `${API}/repos/${encodeURIComponent(SP().besitzer)}/${encodeURIComponent(SP().repo)}/contents/daten/${name}.json`;

async function holen(name) {
  if (istPhp()) {
    const r = await fetch(`daten.php?datei=${name}`, { cache: "no-store", credentials: "same-origin" });
    if (!r.ok) throw new Error(`Der Server antwortet mit Fehler ${r.status}.`);
    const j = await r.json();
    return { inhalt: j.inhalt, version: j.version };
  }
  const r = await fetch(githubUrl(name), { headers: githubKopf(), cache: "no-store" });
  if (r.status === 404) return { inhalt: null, version: null };
  if (r.status === 401) throw new Error("Der GitHub-Schlüssel auf diesem Gerät ist ungültig oder abgelaufen.");
  if (!r.ok) throw new Error(`GitHub antwortet mit Fehler ${r.status}.`);
  const j = await r.json();
  return { inhalt: atob(j.content.replace(/\s/g, "")), version: j.sha };
}
async function ablegen(name, text, version) {
  if (istPhp()) {
    const r = await fetch(`daten.php?datei=${name}`, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-Kalender-Schluessel": token() || "" },
      body: JSON.stringify({ inhalt: text, version }),
    });
    if (r.status === 409) throw new Konflikt();
    if (r.status === 403) throw new Error("Speichern abgelehnt – der Schreibschlüssel auf diesem Gerät ist ungültig.");
    if (!r.ok) throw new Error(`Der Server antwortet mit Fehler ${r.status}.`);
    return;
  }
  // Einheitliche Commit-Nachricht: das öffentliche Repository soll nicht verraten, was geändert wurde
  const body = { message: "Aktualisierung", content: btoa(text) };
  if (version) body.sha = version;
  const r = await fetch(githubUrl(name), { method: "PUT", headers: { ...githubKopf(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) throw new Konflikt();
  if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error("Speichern abgelehnt – GitHub-Schlüssel ungültig oder ohne Schreibrecht.");
  if (!r.ok) throw new Error(`GitHub antwortet mit Fehler ${r.status}.`);
}
async function verschluesseln(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, KEY, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ iv: b64e(iv), daten: b64e(ct) });
}
async function entschluesseln(text) {
  const o = JSON.parse(text);
  return oeffnen({ iv: o.iv, daten: o.daten }, KEY);
}
// Lesen – ändern – schreiben, bei gleichzeitiger Änderung erneut versuchen
async function aendern(pfad, leer, fn) {
  for (let versuch = 0; versuch < 3; versuch++) {
    const { inhalt, version } = await holen(pfad);
    const wert = inhalt ? await entschluesseln(inhalt) : leer;
    const neu = fn(wert);
    try { await ablegen(pfad, await verschluesseln(neu), version); return neu; }
    catch (e) { if (!(e instanceof Konflikt)) throw e; }
  }
  throw new Error("Speichern fehlgeschlagen, bitte erneut versuchen.");
}
async function eingangAendern(fn, ok) {
  try {
    const neu = await aendern(EINGANG, { ops: [] }, w => { w.ops ??= []; fn(w); return w; });
    OPS = neu.ops; allesZeichnen(); meldung(ok); return true;
  } catch (e) { meldung(e.message, true); return false; }
}
async function todosAendern(fn, ok) {
  try {
    const neu = await aendern(TODODATEI, { todos: [] }, w => ({ todos: fn(w.todos || []) }));
    TODOS = neu.todos; allesZeichnen(); meldung(ok); return true;
  } catch (e) { meldung(e.message, true); allesZeichnen(); return false; }
}

let laedt = false;
async function liveLaden() {
  if (!online() || laedt) return;
  laedt = true;
  try {
    const [e, t] = await Promise.all([holen(EINGANG), holen(TODODATEI)]);
    OPS = e.inhalt ? ((await entschluesseln(e.inhalt)).ops || []) : [];
    if (t.inhalt) TODOS = (await entschluesseln(t.inhalt)).todos || [];
    allesZeichnen();
  } catch (err) {
    meldung("Aktuelle ToDos und Ausfälle konnten nicht geladen werden – angezeigt wird der letzte Stand.", true);
  } finally { laedt = false; }
}

function freischaltenFormular() {
  const php = istPhp();
  sheetOeffnen(`<h2 id="detailtitel">Bearbeiten freischalten</h2>
    <div class="unter">${php
      ? "Für ToDos und Ausfälle braucht dieses Gerät den Schreibschlüssel, der bei der Einrichtung angezeigt wurde."
      : `Für ToDos und Ausfälle braucht dieses Gerät einen GitHub-Zugangsschlüssel mit Schreibrecht für das Repository „${esc(SP().repo)}“.`} Er wird nur auf diesem Gerät gespeichert.</div>
    <form class="formular" id="tokenform">
      <label class="feld">${php ? "Schreibschlüssel" : "Zugangsschlüssel"}<input type="password" id="tokenfeld" placeholder="${php ? "" : "github_pat_…"}" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <div class="fehler" id="tokenfehler" role="alert"></div>
      <div class="aktionen"><button type="button" class="knopf" id="tokenabbrechen">Abbrechen</button><button class="knopf primaer" id="tokenspeichern">Prüfen und speichern</button></div>
    </form>`);
  document.getElementById("tokenabbrechen").addEventListener("click", schliessen);
  document.getElementById("tokenform").addEventListener("submit", async e => {
    e.preventDefault();
    const wert = document.getElementById("tokenfeld").value.replace(/\s/g, "");
    const fehler = document.getElementById("tokenfehler"), knopf = document.getElementById("tokenspeichern");
    fehler.textContent = ""; knopf.disabled = true;
    try {
      if (php) {
        const r = await fetch("daten.php?pruefen=1", { method: "POST", credentials: "same-origin", headers: { "X-Kalender-Schluessel": wert } });
        if (r.status === 403) throw new Error("Der Server lehnt diesen Schreibschlüssel ab.");
        if (!r.ok) throw new Error(`Der Server antwortet mit Fehler ${r.status}.`);
      } else {
        const r = await fetch(`${API}/repos/${encodeURIComponent(SP().besitzer)}/${encodeURIComponent(SP().repo)}`,
          { headers: { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + wert }, cache: "no-store" });
        if (r.status === 401) throw new Error("GitHub lehnt diesen Schlüssel ab.");
        if (!r.ok) throw new Error(`Repository nicht erreichbar (Fehler ${r.status}). Ist der Schlüssel für „${SP().repo}“ freigegeben?`);
        const j = await r.json();
        if (!j.permissions || !j.permissions.push) throw new Error("Der Schlüssel hat kein Schreibrecht (Contents: Read and write).");
      }
      schreiben(tokenName(), wert);
      schliessen(); meldung("Bearbeiten ist freigeschaltet");
      allesZeichnen(); liveLaden();
    } catch (err) { fehler.textContent = err.message; knopf.disabled = false; }
  });
}

function start(daten, key) {
  D = daten; KEY = key || null;
  TODOS = D.todos || [];
  vorbereiten();
  document.getElementById("schuljahr").textContent = D.schuljahr;
  document.getElementById("stand").textContent = `Stand: ${D.stand}`;
  zeichneWochenwahl();
  woche = startWoche();
  const ausHash = /^#(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
  if (ausHash) woche = wocheVon(vonIso(ausHash[1]));

  const wahl = document.getElementById("wochenwahl");
  wahl.addEventListener("change", () => { woche = Number(wahl.value); zeichneWoche(); });
  document.getElementById("zurueck").addEventListener("click", () => { if (woche > 0) { woche--; zeichneWoche(); } });
  document.getElementById("vor").addEventListener("click", () => { if (woche < wochen.length - 1) { woche++; zeichneWoche(); } });
  document.getElementById("heute").addEventListener("click", () => { woche = startWoche(); zeichneWoche(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { menueZu(); return schliessen(); }
    if (["SELECT", "INPUT", "TEXTAREA"].includes(e.target.tagName) || document.getElementById("woche").hidden || detail().classList.contains("offen")) return;
    if (e.key === "ArrowLeft" && woche > 0) { woche--; zeichneWoche(); }
    if (e.key === "ArrowRight" && woche < wochen.length - 1) { woche++; zeichneWoche(); }
  });
  let wischX = null, wischY = null;
  const rasterBox = document.getElementById("raster");
  rasterBox.addEventListener("touchstart", e => { wischX = e.touches[0].clientX; wischY = e.touches[0].clientY; }, { passive: true });
  rasterBox.addEventListener("touchend", e => {
    if (wischX === null) return;
    const dx = e.changedTouches[0].clientX - wischX, dy = e.changedTouches[0].clientY - wischY;
    wischX = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0 && woche < wochen.length - 1) woche++;
    else if (dx > 0 && woche > 0) woche--;
    else return;
    zeichneWoche();
  });
  const oeffneAus = e => {
    const b = e.target.closest(".blk, .zeile[data-d], .kurz");
    if (!b) return;
    stundeOeffnen(b.dataset.d, b.dataset.s.split(",").map(Number), Number(b.dataset.g));
  };
  rasterBox.addEventListener("click", oeffneAus);
  document.getElementById("offen").addEventListener("click", oeffneAus);
  document.getElementById("sl-offen").addEventListener("click", oeffneAus);
  for (const id of ["raster", "offen", "sl-offen"]) document.getElementById(id).addEventListener("contextmenu", standMenue);
  document.addEventListener("pointerdown", e => { if (!e.target.closest("#menue")) menueZu(); });
  addEventListener("scroll", menueZu, { passive: true });
  addEventListener("resize", menueZu);
  document.getElementById("schleier").addEventListener("click", schliessen);
  document.getElementById("zu").addEventListener("click", schliessen);
  document.getElementById("freischalten").addEventListener("click", freischaltenFormular);
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => zeigeTab(b.dataset.ansicht)));

  allesZeichnen();
  zeigeTab(lesen("kalender-tab") || "woche");
  if (online()) {
    liveLaden();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") liveLaden(); });
  }
}

// =====================================================================
// Verschlüsselte Fassung (Online-Ansicht)
// =====================================================================
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = puffer => { const b = new Uint8Array(puffer); let s = ""; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode(...b.subarray(i, i + 8192)); return btoa(s); };
const SCHLUESSEL_PRAEFIX = "kalender-schluessel-";

async function oeffnen(V, key) {
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(V.iv) }, key, b64d(V.daten));
  return JSON.parse(new TextDecoder().decode(klar));
}
async function ableiten(V, passwort) {
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(V.salt), iterations: V.iter, hash: "SHA-256" },
    basis, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
}
async function entsperren(V) {
  const seite = document.querySelector(".seite"), sperre = document.getElementById("sperre");
  const speicherName = SCHLUESSEL_PRAEFIX + V.salt;
  const fertig = (daten, key) => {
    sperre.hidden = true; seite.hidden = false;
    document.getElementById("abmelden").hidden = false;
    start(daten, key);
  };
  document.getElementById("abmelden").addEventListener("click", () => {
    if (!confirm("Auf diesem Gerät abmelden? Passwort und Schreibschlüssel werden hier gelöscht.")) return;
    try { Object.keys(localStorage).filter(k => k.startsWith(SCHLUESSEL_PRAEFIX)).forEach(k => localStorage.removeItem(k)); } catch { /* nichts gespeichert */ }
    Object.values(TOKEN_NAMEN).forEach(n => schreiben(n, null));
    location.reload();
  });
  seite.hidden = true;
  if (!window.crypto || !crypto.subtle) {
    sperre.hidden = false;
    document.getElementById("sperrfehler").textContent = "Dieser Browser kann die Seite nicht entschlüsseln (nur über https möglich).";
    return;
  }
  const gespeichert = lesen(speicherName);
  if (gespeichert) {
    try {
      const key = await crypto.subtle.importKey("raw", b64d(gespeichert), "AES-GCM", true, ["encrypt", "decrypt"]);
      return fertig(await oeffnen(V, key), key);
    } catch { schreiben(speicherName, null); }
  }
  sperre.hidden = false;
  const feld = document.getElementById("passwort"), knopf = document.getElementById("entsperren"), fehler = document.getElementById("sperrfehler");
  document.getElementById("sperrform").addEventListener("submit", async e => {
    e.preventDefault();
    knopf.disabled = true; fehler.textContent = "";
    try {
      const key = await ableiten(V, feld.value);
      const daten = await oeffnen(V, key);
      if (document.getElementById("merken").checked) schreiben(speicherName, b64e(await crypto.subtle.exportKey("raw", key)));
      fertig(daten, key);
    } catch {
      fehler.textContent = "Das Passwort ist falsch.";
      knopf.disabled = false; feld.select();
    }
  });
  feld.focus();
}

if (ROH && ROH.klar) start(ROH.klar, null);
else if (ROH && ROH.verschluesselt) entsperren(ROH.verschluesselt);
else document.querySelector(".seite").innerHTML = `<p class="leerhinweis">Diese Datei ist nur die Vorlage. Die Übersicht entsteht mit <code>werkzeug/build.py</code>.</p>`;
